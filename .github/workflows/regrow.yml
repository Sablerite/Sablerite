name: Regrow the specimen

# Rebuilds the README and its SVGs from fresh public activity once a day,
# and whenever the content or the build scripts change.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.mjs
      - scripts/**

permissions:
  contents: write

concurrency:
  group: regrow
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets data
          if git diff --cached --quiet; then
            echo 'Nothing new grew today.'
          else
            git commit -m 'Regrow specimen'
            git push
          fi
